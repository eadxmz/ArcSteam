name: Build ArcSteam (Windows x64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WinFsp Developer SDK
        shell: pwsh
        run: choco install winfsp -y --install-arguments="ADDLOCAL=ALL"

      - name: Build 32-bit Native unarc.dll Host & Bundle All Helpers + WinFsp MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path bundled_tools | Out-Null
          New-Item -ItemType Directory -Force -Path _dl | Out-Null

          $ghHeaders = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "User-Agent"    = "ArcSteam-CI"
            "Accept"        = "application/vnd.github+json"
          }

          # 1. Compile 32-bit LAA unarc_host32.exe using MSVC x86 (in isolated subshell)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars32 = Join-Path $vsPath "VC\Auxiliary\Build\vcvars32.bat"
          cmd.exe /c "`"$vcvars32`" && cl.exe /nologo /O2 /MT tools_src\unarc_host32.c /Fe:bundled_tools\unarc_host32.exe /link /LARGEADDRESSAWARE"
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile unarc_host32.exe" }

          # 2. 7-Zip CLI (preinstalled on windows-latest)
          Copy-Item "C:\Program Files\7-Zip\7z.exe" "bundled_tools\7z.exe" -Force
          Copy-Item "C:\Program Files\7-Zip\7z.dll" "bundled_tools\7z.dll" -Force

          # 3. innoextract (Inno Setup up to 6.7.0, with official 1.9 fallback)
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/UserUnknownFactor/innoextract_win/releases/latest" -Headers $ghHeaders
            $asset = $rel.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
            Invoke-WebRequest $asset.browser_download_url -OutFile "_dl\innoextract.zip"
          } catch {
            Invoke-WebRequest "https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip" -OutFile "_dl\innoextract.zip"
          }
          Expand-Archive "_dl\innoextract.zip" -DestinationPath "_dl\innoextract" -Force
          $inno = Get-ChildItem "_dl\innoextract" -Recurse -Filter "innoextract.exe" | Select-Object -First 1
          Copy-Item $inno.FullName "bundled_tools\innoextract.exe" -Force

          # 4. innounp-2 (Inno Setup up to 7.1.1, with v0.50 fallback)
          try {
            Invoke-WebRequest "https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/master/innounp-2/innounp-2.zip" -OutFile "_dl\innounp.zip"
            Expand-Archive "_dl\innounp.zip" -DestinationPath "_dl\innounp" -Force
            $iu = Get-ChildItem "_dl\innounp" -Recurse -Filter "innounp*.exe" | Select-Object -First 1
            Copy-Item $iu.FullName "bundled_tools\innounp.exe" -Force
          } catch {
            Invoke-WebRequest "https://github.com/WhatTheBlock/innounp/releases/download/v0.50/innounp.exe" -OutFile "bundled_tools\innounp.exe"
          }

          # 5. Fallback unarc.exe (for raw .arc archives without a setup.exe)
          try {
            Invoke-WebRequest "https://github.com/Bioruebe/UniExtract2/releases/download/v2.0.0-rc.3/UniExtractRC3.zip" -OutFile "_dl\uniextract.zip"
            & "C:\Program Files\7-Zip\7z.exe" e "_dl\uniextract.zip" -o"_dl\unarc" "unarc.exe" -r -y | Out-Null
          } catch {
            Invoke-WebRequest "https://downloads.sourceforge.net/project/freearc/FreeArc/FreeArc%200.666/FreeArc-0.666-win32.exe" -OutFile "_dl\freearc.exe"
            & "C:\Program Files\7-Zip\7z.exe" e "_dl\freearc.exe" -o"_dl\unarc" "unarc.exe" -r -y | Out-Null
          }
          $ua = Get-ChildItem "_dl\unarc" -Recurse -Filter "unarc.exe" | Select-Object -First 1
          if ($ua) { Copy-Item $ua.FullName "bundled_tools\unarc.exe" -Force }

          # 6. Official signed WinFsp MSI (~2.1 MB) embedded for 1-click built-in install
          try {
            $wfRel = Invoke-RestMethod "https://api.github.com/repos/winfsp/winfsp/releases/latest" -Headers $ghHeaders
            $wfMsi = $wfRel.assets | Where-Object { $_.name -like "winfsp-*.msi" } | Select-Object -First 1
            Invoke-WebRequest $wfMsi.browser_download_url -OutFile "bundled_tools\winfsp.msi"
          } catch {
            Invoke-WebRequest "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile "bundled_tools\winfsp.msi"
          }

          Remove-Item -Recurse -Force _dl
          Write-Host "All bundled binaries ready for embedding:"
          Get-ChildItem bundled_tools | Format-Table Name, Length -AutoSize

      - name: Install Rust Stable (2024 edition)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "arcsteam-win-x64-v2"
          cache-all-crates: true

      - name: Build Standalone Release Binary
        run: cargo build --release

      - name: Upload Standalone arcsteam.exe
        uses: actions/upload-artifact@v4
        with:
          name: ArcSteam-Windows-x64
          path: target/release/arcsteam.exe

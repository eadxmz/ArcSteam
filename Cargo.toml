[package]
name = "arcsteam"
version = "0.1.0"
edition = "2024"
description = "Live Torrent-to-Unpack Streamer & Universal Turbo Repack Installer"

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
librqbit = { version = "9.1.0", features = ["http-api"] }
winfsp = { version = "0.13.2", features = ["delayload"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["blocking"] }
rfd = "0.15"
sysinfo = "0.33"
anyhow = "1"
regex = "1"
walkdir = "2"
widestring = "1"
windows = { version = "0.61", features = ["Win32_System_Threading", "Win32_Storage_FileSystem"] }

[build-dependencies]
winfsp = "0.13.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
